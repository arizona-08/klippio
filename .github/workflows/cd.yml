name: Déploiement continu sur le serveur de production
on:
  push:
    branches:
      - pre-prod
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:latest

      - name: Build and push Frontend App
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/application
          file: ./frontend/application/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}-app:latest

      - name: Build and push Frontend Marketing
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/marketing
          file: ./frontend/marketing/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}-marketing:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_SSH_PORT }}
          script: |
            cd /home/${{ secrets.PROD_SERVER_USER }}/klippio
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans