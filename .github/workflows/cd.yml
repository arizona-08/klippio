name: Déploiement continu sur le serveur de production
on:
  pull_request:
    branches:
      - pre-prod
  push:
    branches:
      - pre-prod
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          no-cache: true
          file: ./backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}

      - name: Build and push Frontend App
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/application
          file: ./frontend/application/Dockerfile.prod
          no-cache: true
          push: true
          tags: ghcr.io/${{ github.repository }}-app:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://api.klippio.sajed-engineering.com
            NEXT_PUBLIC_AMAZON_S3_REGION=eu-north-1
            NEXT_PUBLIC_AMAZON_S3_BUCKET_NAME=klippio-s3-bucket

      - name: Build and push Frontend Marketing
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/marketing
          file: ./frontend/marketing/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}-marketing:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://app.klippio.sajed-engineering.com

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_SSH_PORT }}
          script: |
            cd /home/${{ secrets.PROD_SERVER_USER }}/klippio
            git fetch origin pre-prod
            git reset --hard origin/pre-prod
            echo "IMAGE_TAG=${{ github.sha }}" > .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -af