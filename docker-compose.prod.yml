services:

  frontend:
    container_name: frontend-app
    build: 
      context: ./frontend/application
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/application/.env
    depends_on:
      - backend
    networks:
      - klippio-network

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - klippio-network

  db:
    container_name: db
    image: postgres:latest
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - klippio-network

  # Ajouter mailpit
  mailer:
    container_name: mailer
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - klippio-network

volumes:
  db_data:

networks:
  klippio-network:
    driver: bridge